<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Budget</title>
<meta name="theme-color" content="#0e6b55">
<meta name="description" content="Free budget app in English and Spanish. No sign-up. Your data stays on your phone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230e6b55'/%3E%3Ccircle cx='256' cy='256' r='154' fill='none' stroke='%23fff' stroke-width='26'/%3E%3Ctext x='256' y='262' fill='%23fff' font-family='Arial' font-weight='700' font-size='205' text-anchor='middle' dominant-baseline='central'%3E$%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: phone-first single column. A deep "wallet card" with a spend ring opens Home; light paper below; bottom tab bar with a raised Add key that opens a keypad sheet. */
:root{
  /* accent pairs (light / dark) are switched by data-accent */
  --a-l:#0e6b55; --a-d:#3fbf98;
  --paper:#f1f4f2; --surface:#ffffff; --ink:#122019; --muted:#5a6b64; --line:#dde5e1; --sunk:#e8eeeb;
  --accent:var(--a-l); --on-accent:#ffffff;
  --gold:#e0a21b; --good:#178060; --warn:#a85f00; --bad:#c2372d;
  --warn-soft:#fdf0dc; --bad-soft:#fbe4e1; --good-soft:#dcf1e8;
  --shadow:0 1px 2px rgba(18,32,25,.05),0 10px 30px rgba(18,32,25,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:22px;
}
:root[data-accent="ocean"]{--a-l:#1f5fc9;--a-d:#7aa9ff}
:root[data-accent="coral"]{--a-l:#c4462f;--a-d:#ff8f78}
:root[data-accent="plum"]{--a-l:#7a3a8f;--a-d:#d39ae6}
:root[data-accent="gold"]{--a-l:#9a6400;--a-d:#f2b84a}
:root[data-accent="ink"]{--a-l:#26333a;--a-d:#b9c7cf}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b1210; --surface:#141d1a; --ink:#e4eeea; --muted:#94a8a0; --line:#24322d; --sunk:#1b2622;
    --accent:var(--a-d); --on-accent:#06150f;
    --gold:#f2b84a; --good:#4cc79c; --warn:#f0a94a; --bad:#ff8577;
    --warn-soft:#352812; --bad-soft:#3a1a17; --good-soft:#143127;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0b1210; --surface:#141d1a; --ink:#e4eeea; --muted:#94a8a0; --line:#24322d; --sunk:#1b2622;
  --accent:var(--a-d); --on-accent:#06150f;
  --gold:#f2b84a; --good:#4cc79c; --warn:#f0a94a; --bad:#ff8577;
  --warn-soft:#352812; --bad-soft:#3a1a17; --good-soft:#143127;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:21px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:14px}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:14px 12px}
.hello{min-width:0}
.hello .k{font-size:14px;color:var(--muted)}
.hello h1{font-size:23px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pillbtn{border:1px solid var(--line);background:var(--surface);height:40px;padding:0 12px;border-radius:999px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none}

/* Banner */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:16px;padding:11px 12px;margin-bottom:14px;font-size:14px}
.banner b{font-weight:700}
.banner .btn{margin-left:auto}

/* Wallet card */
.wallet{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 18px;color:#fff;
  background:
    radial-gradient(circle at 110% -10%,rgba(255,255,255,.16) 0 18%,transparent 18.2%),
    radial-gradient(circle at 110% -10%,rgba(255,255,255,.08) 0 30%,transparent 30.2%),
    radial-gradient(circle at 110% -10%,rgba(255,255,255,.05) 0 42%,transparent 42.2%),
    linear-gradient(155deg,color-mix(in srgb,var(--a-l) 92%,#000) 0%,color-mix(in srgb,var(--a-l) 55%,#000) 100%);
  box-shadow:0 18px 40px color-mix(in srgb,var(--a-l) 30%,transparent)}
.wallet .row1{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.16);stroke-width:12}
.ring .arc{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring .arc.low{stroke:#ffd166} .ring .arc.over{stroke:#ff9a8b}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid small{display:block;font-size:12px;opacity:.8;letter-spacing:.04em}
.ring .mid b{display:block;font:800 25px/1.05 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;max-width:118px;overflow-wrap:anywhere}
.wallet .say{min-width:0}
.wallet .say .lbl{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.wallet .say .big{font:800 clamp(30px,8.5vw,40px)/1.05 var(--f-display);letter-spacing:-.03em;margin:4px 0 6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wallet .say p{margin:0;font-size:14px;opacity:.9;line-height:1.4}
.wallet .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.wallet .stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 11px;min-width:0}
.wallet .stat small{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet .stat b{display:block;font:700 16px/1.25 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.wallet .row1{flex-direction:column;align-items:flex-start}.ring{width:132px;height:132px}}

/* Quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.qa.in .ic{background:color-mix(in srgb,var(--gold) 18%,var(--surface));color:color-mix(in srgb,var(--gold) 75%,var(--ink))}

/* Sections & panels */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 2px 10px}
.sh .link{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:15px}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;display:inline-block}
.pill.today{background:var(--bad-soft);color:var(--bad)} .pill.soon{background:var(--warn-soft);color:var(--warn)} .pill.in{background:var(--good-soft);color:var(--good)}

/* Rows */
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.list>.item:first-child,.list>.dsep:first-child+.item{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt.in{color:var(--good)}
.tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 78%,var(--ink))}
.tile .icon{width:20px;height:20px}
.dsep{padding:10px 14px 6px;font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;background:var(--sunk);border-top:1px solid var(--line)}
.list>.dsep:first-child{border-top:0}

/* Bars */
.bar{position:relative;height:9px;border-radius:99px;background:var(--sunk)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--good));max-width:100%}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.bar .pace{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--gold)}
.cat{padding:13px 14px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.list>.cat:first-child{border-top:0}
.cat .main{flex:1;min-width:0}
.cat .spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.cat .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cat .vals{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.editbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0 6px 8px}

/* Chart */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .lbl{font:12px var(--f-body);fill:var(--muted)}
.chart .val{font:700 11px var(--f-body);fill:var(--muted)}
.chart .b{fill:color-mix(in srgb,var(--accent) 30%,var(--sunk))}
.chart .b.now{fill:var(--accent)}
.chart .b.over{fill:var(--warn)}
.chart .avg{stroke:var(--gold);stroke-width:2;stroke-dasharray:5 5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--gold);display:inline-block}

/* Donut */
.donutwrap{display:flex;gap:18px;align-items:center}
.donut{width:132px;height:132px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted)}
.donut .mid b{display:block;font:800 18px/1.1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.dleg{display:flex;flex-direction:column;gap:7px;font-size:14px;min-width:0;flex:1}
.dleg div{display:flex;align-items:center;gap:8px;min-width:0}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dleg b{font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:380px){.donutwrap{flex-direction:column;align-items:stretch}.donut{align-self:center}}

/* Key-value */
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:15px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.kv .total{font-weight:800;font-family:var(--f-display);font-size:18px}
.workcard{border-radius:var(--r);padding:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.workcard .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.workcard .hd h3{font-size:18px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--sunk);border-radius:14px;padding:10px;min-width:0}
.trio small{display:block;font-size:12px;color:var(--muted)}
.trio b{display:block;font:700 16px/1.25 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taxline{margin-top:10px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.taxline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Buttons & form */
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.btn.block{width:100%;padding:15px;border-radius:16px;font-size:17px}
.btn.soft{background:color-mix(in srgb,var(--accent) 13%,var(--surface));color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 13px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:700}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;background:var(--sunk);border:1.5px solid transparent;border-radius:14px;padding:12px;min-height:48px}
textarea{min-height:90px;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:11px;font-weight:700;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:999px;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);background:var(--sw)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.iconpick{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.iconpick button{border:1.5px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconpick button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.profiles{display:flex;flex-direction:column;gap:10px}
.prof{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:13px 14px;width:100%}
.prof .main{flex:1;min-width:0}
.prof b{display:block}
.prof small{color:var(--muted);font-size:14px}
.prof .chk{width:26px;height:26px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.prof[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.prof[aria-pressed="true"] .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;margin-top:14px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* Add sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.open{transform:translateY(0)}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheethd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheethd h2{flex:1}
.amount{text-align:center;padding:6px 0 4px}
.amount .v{font:800 52px/1.05 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.amount .v.ph{color:var(--muted);opacity:.5}
.amount.in .v{color:var(--good)}
.catscroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin;scroll-snap-type:x proximity}
.cchip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 10px 8px 8px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;scroll-snap-align:start;max-width:180px}
.cchip .tile{width:30px;height:30px;border-radius:9px}
.cchip .tile .icon{width:17px;height:17px}
.cchip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.glabel{flex:none;align-self:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);padding:0 2px}
.minirow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.minirow>*{min-width:0}
.minirow #sNote{grid-column:1/-1}
.minirow input,.minirow select{min-height:44px;padding:9px 10px;font-size:15px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.key{border:0;background:var(--sunk);border-radius:16px;height:56px;font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.key:active{background:color-mix(in srgb,var(--accent) 18%,var(--sunk))}
.scanbtn{border:1.5px dashed color-mix(in srgb,var(--gold) 70%,transparent);background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-radius:14px;padding:9px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.scanbtn.busy{opacity:.7;cursor:progress}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.ring .arc{transition:none}}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:12px;min-width:0}
.tab[aria-current="page"]{color:var(--accent)}
.tab.add .circle{width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.tab.add .circle .icon{width:28px;height:28px;stroke-width:2.6}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,460px);z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.planbar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 2px}
.planbar i{display:block;height:100%}
.prow{display:flex;gap:10px;align-items:flex-start;padding-top:12px}
.prow .main{flex:1;min-width:0}
.pdot{width:12px;height:12px;border-radius:4px;flex:none;margin-top:5px;display:inline-block}
.prow .spread{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;align-items:baseline}
.prow .spread b{white-space:nowrap}
.prow .vals{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pin{background:var(--sunk);border-radius:16px;padding:10px 12px;min-width:0}
.pin label{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
.pin label .pdot{margin:0}
.pin .pctwrap{display:flex;align-items:center;gap:6px;margin-top:6px;font:800 20px/1 var(--f-display)}
.pin input[type=text]{font:800 24px/1 var(--f-display);text-align:right;padding:8px 10px;min-height:46px;background:var(--surface)}
.pin small{display:block;color:var(--muted);font-size:13px;margin-top:5px;font-variant-numeric:tabular-nums}
.ptotal{margin-top:12px;font-weight:700;font-size:14px;color:var(--good)}
.ptotal.bad{color:var(--bad)}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 4px 8px;font-size:14px}
.bh b{display:inline-flex;align-items:center;gap:8px;font-size:16px}
.bh .pdot{margin:0}
.view[hidden]{display:none}
.note{font-size:14px;color:var(--muted);line-height:1.5;margin:0}
.note b{color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
</style>

</head>

}

function csvFile() {

/* ======================= Events ======================= */

  if (!a) return;
  var f = ui.sheet;
  switch (a) {

    case 'newCat': ui.edit = { isNew: true, kind: d.kind, group: d.g, bucket: 'wants', name: '', val: '', icon: d.kind === 'in' ? 'coin' : 'dots', color: COLORS[(S.cats.length) % COLORS.length] }; renderBudget(); var n = $('ceName'); if (n) n.focus(); return;
    case 'pickIcon': ui.edit.icon = d.n; renderBudget(); return;

      if (!inc || inc <= 0) { toast(t('add.needAmt')); $('pe_inc').focus(); return; }
      if (armed !== el) { armed = el; el.dataset.label = el.textContent; el.textContent = t('plan.confirm'); setTimeout(function () { if (armed === el) { el.textContent = el.dataset.label; armed = null; } }, 3500); return; }
      armed = null; S.plan = { id: planId(pe.pct), pct: Object.assign({}, pe.pct), income: inc }; applyPlan(S); ui.planEdit = null; save(); toast(t('plan.applied')); renderBudget(); return;
    case 'startPlan': ui.start.plan = d.id; renderStart(); return;

    case 'saveBill': var eb = readBill('eb'); if (!eb) return; var ob = S.bills.find(function (b) { return b.id === d.id; }); if (eb.name !== billName(ob)) ob.nk = null; Object.assign(ob, eb); ui.editBill = null; ui.editBillKind = null; processBills(); save(); toast(t('bl.saved')); renderBills(); return;

function saveCat() {

  var clash = S.cats.some(function (c) { return c.id !== e.id && c.kind === e.kind && c.group === e.group && catName(c).toLowerCase() === name.toLowerCase(); });
  if (clash) { toast(t('b.dup')); return; }

  c.icon = e.icon; c.color = e.color;
  if (c.group === 'personal' && c.kind === 'out') c.bucket = e.bucket || 'wants';
  if (c.kind === 'in') c.expected = val && val > 0 ? val : 0; else c.limit = val && val > 0 ? val : 0;
  if (e.isNew) S.cats.push(c);
  ui.edit = null; save(); toast(e.isNew ? t('b.added', { n: name }) : t('b.saved')); renderBudget();
}
function delCat(btn) {
  var c = cat(ui.edit.id);
  if (S.cats.filter(function (x) { return x.kind === c.kind && x.group === c.group; }).length <= 1) { toast(t('b.keep')); return; }
  if (!confirmTap(btn)) return;
  // Keep past entries readable: move them to "Other" in the same group if possible.
  var other = S.cats.find(function (x) { return x.id !== c.id && x.kind === c.kind && x.group === c.group && (x.key === 'other' || x.key === 'otherIn' || x.key === 'otherBiz'); }) ||
    S.cats.find(function (x) { return x.id !== c.id && x.kind === c.kind && x.group === c.group; });
  S.tx.forEach(function (x) { if (x.cat === c.id) x.cat = other.id; }); S.bills.forEach(function (b) { if (b.cat === c.id) b.cat = other.id; });
  S.cats = S.cats.filter(function (x) { return x.id !== c.id; }); ui.edit = null; save(); toast(t('b.deleted')); renderBudget();

$('langBtn').addEventListener('click', function () { S.lang = LANG === 'es' ? 'en' : 'es'; LANG = S.lang; fmtC = {}; save(); render(); if (ui.sheet) renderSheet(); });

document.addEventListener('keydown', function (e) {
  if (!ui.sheet) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) { if (e.key === 'Enter' && e.target.id === 'sNote') { e.preventDefault(); saveTx(); } return; }
  if (/^[0-9]$/.test(e.key)) { keyIn(e.key); e.preventDefault(); }

if (!S) {
  var old = null; try { old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null'); } catch (e) { /* none */ }

}
LANG = S.lang || detectLang();
var logged = processBills();
var h0 = (location.hash || '').slice(1);
go(h0 === 'add' ? 'home' : h0 || 'home');
if (h0 === 'add') openSheet('out');
if (logged.length && !S.demo) toast(t('billsLogged', { n: logged.join(', ') }));
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* ignore */ }
})();
