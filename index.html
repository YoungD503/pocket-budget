<html lang="en">
<head>

<meta name="theme-color" content="#0e6b55">
<meta name="description" content="Free budget and expense tracker. No sign-up. Your data stays on your phone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">

<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one phone-width column; a "today's receipt" card leads, sticky header on top, tab bar with a center Add button at the bottom. */
:root{
  --paper:#eef3f1; --surface:#ffffff; --ink:#132620; --muted:#586c65; --line:#d7e2dd;
  --brand:#0e6b55; --brand-ink:#ffffff; --brand-soft:#dcefe7;
  --gold:#c98a0c; --gold-soft:#fbefd2;
  --good:#16805f; --warn:#a85f00; --warn-soft:#fdf0dc; --bad:#be3329; --bad-soft:#fbe4e1;
  --shadow:0 1px 2px rgba(19,38,32,.06),0 8px 24px rgba(19,38,32,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1412; --surface:#141f1c; --ink:#e3eeea; --muted:#94aaa2; --line:#253530;
    --brand:#3db592; --brand-ink:#04201a; --brand-soft:#16322a;
    --gold:#f0b941; --gold-soft:#33290f;
    --good:#4cc79c; --warn:#f0a94a; --warn-soft:#352812; --bad:#ff8577; --bad-soft:#3a1a17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1412; --surface:#141f1c; --ink:#e3eeea; --muted:#94aaa2; --line:#253530;
  --brand:#3db592; --brand-ink:#04201a; --brand-soft:#16322a;
  --gold:#f0b941; --gold-soft:#33290f;
  --good:#4cc79c; --warn:#f0a94a; --warn-soft:#352812; --bad:#ff8577; --bad-soft:#3a1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:9px;font:700 19px/1 var(--f-display);letter-spacing:-.01em}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 16px/1 var(--f-display);font-style:normal}
.top .month{margin-left:auto;color:var(--muted);font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}

/* Demo banner */
.demo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.demo b{font-weight:700}
.demo .btn{margin-left:auto}

/* Generic */
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:700}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 2px 10px}
.section-head .link{border:0;background:none;color:var(--brand);font-weight:700;font-size:14px;padding:4px 0}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink);white-space:nowrap}
.btn.block{width:100%;padding:15px;border-radius:14px;font-size:17px}
.btn.ghost{background:var(--brand-soft);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:90px;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:15px}

/* Receipt hero */
.receipt{position:relative;background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:18px 18px 22px;box-shadow:var(--shadow);margin-bottom:14px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:linear-gradient(-45deg,transparent 7px,var(--surface) 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,var(--surface) 0) 0 0/14px 10px repeat-x}
.receipt .greet{font-size:15px;color:var(--muted)}
.receipt .big{font:800 clamp(44px,13vw,60px)/1 var(--f-display);letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.receipt .big.over{color:var(--bad)}
.receipt .cap{font-size:15px}
.dash{border:0;border-top:2px dashed var(--line);margin:16px 0 10px}
.lines{display:flex;flex-direction:column;gap:6px;font-size:15px}
.lines .ln{display:flex;align-items:baseline;gap:8px}
.lines .ln span:first-child{white-space:nowrap}
.lines .ln .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.lines .ln b{font-variant-numeric:tabular-nums}
.brief{margin-top:12px;font-size:14px;color:var(--muted)}

/* Bars */
.bar{position:relative;height:10px;border-radius:99px;background:var(--paper);overflow:visible}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--good);max-width:100%}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.bar .pace{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--good);display:inline-block}
.legend i.p{width:3px;height:12px;background:var(--gold)}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list>.item:first-child,.list>div:first-child>.item{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--good)}
.dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font:800 14px/1 var(--f-display);background:var(--brand-soft);color:var(--brand)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--paper);color:var(--muted);white-space:nowrap}
.pill.today{background:var(--bad-soft);color:var(--bad)} .pill.soon{background:var(--warn-soft);color:var(--warn)} .pill.in{background:var(--brand-soft);color:var(--good)}
.dot.in{background:var(--gold-soft);color:var(--gold)}
.bar.inc>i{background:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.daysep{padding:10px 14px 6px;font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;background:var(--paper);border-top:1px solid var(--line)}
.list>.daysep:first-child{border-top:0}

/* Category rows */
.cat{padding:13px 14px;border-top:1px solid var(--line)}
.list>.cat:first-child{border-top:0}
.cat .spread{margin-bottom:7px}
.cat .name{font-weight:700}
.cat .vals{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .edit{border:0;background:none;color:var(--brand);font-weight:700;font-size:14px;padding:2px 0 2px 10px}

/* Add form */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.amount-in{font:800 44px/1.1 var(--f-display);text-align:center;letter-spacing:-.02em;padding:14px;min-height:80px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.scan{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px dashed var(--gold);background:var(--gold-soft);border-radius:16px;padding:16px;font-weight:700;cursor:pointer;text-align:center}
.scan svg{width:22px;height:22px;stroke:currentColor;flex:none}
.scan.busy{opacity:.75;cursor:progress}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:12px}
.tab svg{width:22px;height:22px;stroke:currentColor}
.tab[aria-current="page"]{color:var(--brand)}
.tab.add{color:var(--brand-ink)}
.tab.add span.circle{width:54px;height:54px;border-radius:18px;background:var(--brand);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 40%,transparent)}
.tab.add span.circle svg{width:26px;height:26px;stroke:var(--brand-ink)}
.tab.add .lbl{color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,460px);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.view[hidden]{display:none}
.note{font-size:14px;color:var(--muted);line-height:1.5}
.note b{color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:15px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
code{font-size:13px;background:var(--paper);padding:2px 6px;border-radius:6px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true">$</i>Pocket Budget</div>
    <div class="month" id="hdrMonth"></div>
    <button class="iconbtn" data-go="more" aria-label="More options and backup">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </button>
  </header>

  <div id="demoBar"></div>

  <!-- TODAY -->
  <main class="view" id="v-today" aria-label="Today"></main>
  <!-- ADD -->
  <section class="view" id="v-add" aria-label="Add" hidden></section>
  <!-- BUDGET -->
  <section class="view" id="v-budget" aria-label="Budget" hidden></section>
  <!-- BILLS -->
  <section class="view" id="v-bills" aria-label="Bills" hidden></section>
  <!-- HISTORY -->
  <section class="view" id="v-history" aria-label="History" hidden></section>
  <!-- MORE -->
  <section class="view" id="v-more" aria-label="More" hidden></section>
  <!-- START -->
  <section class="view" id="v-start" aria-label="Start my budget" hidden></section>
</div>

<nav class="tabs" aria-label="Main">
  <div class="in">
    <button class="tab" data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v15l-2.5-1.5L15 19l-3-1.5L9 19l-2.5-1.5L4 19z"/><path d="M8 9h8M8 13h5"/></svg>Today</button>
    <button class="tab" data-go="budget"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Budget</button>
    <button class="tab add" data-go="add" aria-label="Add expense"><span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="lbl">Add</span></button>
    <button class="tab" data-go="bills"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bills</button>
    <button class="tab" data-go="history"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>History</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ================= Storage ================= */
var KEY = 'pocketBudget.v1';
var canSave = true;
function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || 'null'); return v && v.v === 1 ? v : null; } catch (e) { canSave = false; return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); canSave = true; } catch (e) { canSave = false; } }

/* ================= Dates (local, as YYYY-MM-DD strings) ================= */
function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function parts(k) { var a = k.split('-').map(Number); return { y: a[0], m: a[1], d: a[2] }; }

function dayNum(k) { var p = parts(k); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 864e5); }

  var p = parts(k), t = p.m - 1 + months, y = p.y + Math.floor(t / 12), m = t % 12 + 1;

}
function monthKey(k) { return k.slice(0, 7); }
function monthName(mk, long) { var p = mk.split('-'); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(undefined, { month: long ? 'long' : 'short', year: long === 'y' ? 'numeric' : undefined }); }
function niceDate(k) { var p = parts(k); return new Date(p.y, p.m - 1, p.d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function when(n) { return n <= 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; }

/* ================= Money ================= */
var CURRENCIES = [['USD','US dollar'],['MXN','Mexican peso'],['CAD','Canadian dollar'],['EUR','Euro'],['GBP','British pound'],['COP','Colombian peso'],['GTQ','Guatemalan quetzal'],['HNL','Honduran lempira'],['SVC','Salvadoran colón'],['DOP','Dominican peso'],['PEN','Peruvian sol'],['CLP','Chilean peso'],['ARS','Argentine peso'],['BRL','Brazilian real'],['VES','Venezuelan bolívar'],['PHP','Philippine peso'],['INR','Indian rupee'],['NGN','Nigerian naira'],['AUD','Australian dollar']];

  var r = ((navigator.language || 'en-US').split('-')[1] || 'US').toUpperCase();

}
var fmtCache = {};
function money(n) {

  try { if (!fmtCache[c]) fmtCache[c] = new Intl.NumberFormat(undefined, { style: 'currency', currency: c }); return fmtCache[c].format(n || 0); }
  catch (e) { return c + ' ' + (n || 0).toFixed(2); }
}

  if (!t) return null;
  var lastDot = t.lastIndexOf('.'), lastComma = t.lastIndexOf(',');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function initial(s) { return esc((String(s || '?').trim()[0] || '?').toUpperCase()); }

/* ================= Data ================= */
var DEFAULT_CATS = [['Housing',1200],['Groceries',450],['Transport',250],['Utilities',200],['Dining out',150],['Health',100],['Subscriptions',60],['Entertainment',80],['Shopping',120],['Debt payments',200],['Savings',300],['Other',100]];
var METHODS = ['Card', 'Cash', 'Bank transfer', 'Mobile wallet', 'Other'];
var CYCLES = ['Weekly', 'Every 2 weeks', 'Monthly', 'Quarterly', 'Yearly'];
var PER_MONTH = { 'Weekly': 52 / 12, 'Every 2 weeks': 26 / 12, 'Monthly': 1, 'Quarterly': 1 / 3, 'Yearly': 1 / 12 };
var DEFAULT_INCOME = [['Salary', 0], ['Side job', 0], ['Tips', 0], ['Benefits', 0], ['Gift', 0], ['Other income', 0]];
function incomeNames() { return S.incomeCats.map(function (c) { return c.name; }); }

  if (!s.incomeCats) {
    s.incomeCats = DEFAULT_INCOME.map(function (c) { return { id: uid(), name: c[0], expected: c[1] }; });
    s.tx.forEach(function (x) {
      if (x.type === 'Income' && !s.incomeCats.some(function (c) { return c.name === x.cat; })) s.incomeCats.push({ id: uid(), name: x.cat, expected: 0 });
    });
  }

}

/** Logs bills due today or earlier (when auto-log is on) and moves their dates forward. */
function processBills() {
  var t = today(), logged = [];
  S.bills.forEach(function (b) {
    var guard = 0;
    while (b.next && b.next <= t && guard++ < 60) {
      if (b.auto) {
        var inc = isIncomeBill(b);
        S.tx.push({ id: uid(), date: b.next, type: inc ? 'Income' : 'Expense', cat: b.cat || (inc ? 'Other income' : 'Subscriptions'), desc: b.name, amount: b.amount, method: 'Auto', src: 'bill' });
        logged.push(b.name);
      }
      b.next = addCycle(b.next, b.cycle);
    }
  });
  if (logged.length) save();
  return logged;
}

function stats() {
  var t = today(), mk = monthKey(t), p = parts(t), days = dim(p.y, p.m), daysLeft = days - p.d + 1;
  var byCat = {}, byIncome = {}, spent = 0, income = 0, spentToday = 0, todayItems = [];
  S.tx.forEach(function (x) {
    if (monthKey(x.date) !== mk) return;
    if (x.type === 'Income') { income += x.amount; byIncome[x.cat] = (byIncome[x.cat] || 0) + x.amount; if (x.date === t) todayItems.push(x); return; }
    spent += x.amount; byCat[x.cat] = (byCat[x.cat] || 0) + x.amount;
    if (x.date === t) { spentToday += x.amount; todayItems.push(x); }
  });
  var budget = S.cats.reduce(function (a, c) { return a + (Number(c.limit) || 0); }, 0);
  var cats = S.cats.map(function (c) { var sp = byCat[c.name] || 0; return { id: c.id, name: c.name, limit: +c.limit || 0, spent: sp, pct: c.limit > 0 ? sp / c.limit : (sp > 0 ? 1 : 0) }; });
  Object.keys(byCat).forEach(function (n) { if (!S.cats.some(function (c) { return c.name === n; })) cats.push({ id: null, name: n, limit: 0, spent: byCat[n], pct: 1 }); });
  var bills = S.bills.filter(function (b) { return b.next; }).map(function (b) { return Object.assign({}, b, { days: dayNum(b.next) - dayNum(t) }); }).sort(function (a, b) { return a.days - b.days; });
  var committed = bills.filter(function (b) { return !isIncomeBill(b) && monthKey(b.next) === mk && b.days >= 0; }).reduce(function (a, b) { return a + b.amount; }, 0);
  var incomes = S.incomeCats.map(function (c) { return { id: c.id, name: c.name, expected: +c.expected || 0, got: byIncome[c.name] || 0 }; });
  Object.keys(byIncome).forEach(function (n) { if (!S.incomeCats.some(function (c) { return c.name === n; })) incomes.push({ id: null, name: n, expected: 0, got: byIncome[n] }); });
  var expectedIncome = incomes.reduce(function (a, c) { return a + c.expected; }, 0);
  var nextPay = bills.filter(function (b) { return isIncomeBill(b) && b.days >= 0; })[0] || null;
  var remaining = budget - spent;
  var allowance = Math.max(0, remaining + spentToday - committed) / daysLeft;
  return { t: t, mk: mk, day: p.d, days: days, daysLeft: daysLeft, spent: spent, income: income, budget: budget, remaining: remaining,
    committed: committed, allowance: allowance, spentToday: spentToday, todayItems: todayItems, cats: cats, bills: bills,
    incomes: incomes, expectedIncome: expectedIncome, nextPay: nextPay,
    expected: p.d / days, used: budget > 0 ? spent / budget : 0 };
}

/* ---------- Receipt scanning (on-device OCR) ---------- */
var tessLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tessLoading) return tessLoading;
  tessLoading = new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = function () { res(); }; s.onerror = function () { tessLoading = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return tessLoading;
}
function shrink(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      var g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function setScan(text, busy) { var l = $('scanLbl'), t = $('scanTxt'); if (t) t.textContent = text; if (l) l.classList.toggle('busy', !!busy); }
function scanFile(file) {
  if (!file) return;
  readForm();
  setScan('Getting the receipt reader ready…', true);
  var worker;
  loadTesseract().then(function () {
    return shrink(file);
  }).then(function (canvas) {
    return Tesseract.createWorker('eng', 1, { logger: function (m) { if (m.status === 'recognizing text') setScan('Reading receipt… ' + Math.round(m.progress * 100) + '%', true); } })
      .then(function (w) { worker = w; setScan('Reading receipt…', true); return w.recognize(canvas); });
  }).then(function (r) {
    if (worker) worker.terminate();
    var p = parseReceipt(r.data.text || '', S.cats.map(function (c) { return c.name; }));
    ui.type = 'Expense'; ui.receipt = true;
    if (p.amount != null) ui.form.amount = p.amount.toFixed(2);
    if (p.date) ui.form.date = p.date;
    if (p.merchant) ui.form.desc = p.merchant;
    if (p.category) ui.cat = p.category;
    renderAdd();
    toast(p.amount != null ? 'Found ' + money(p.amount) + (p.merchant ? ' at ' + p.merchant : '') + '. Check it, then Save.' : 'Could not find the total. Please type it.');
    if (p.amount == null && $('fAmount')) $('fAmount').focus();
  }).catch(function (e) {

function parseReceipt(text, cats) {
  var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
  var moneyRe = /(?:^|[^\d])(\d{1,3}(?:[.,]\d{3})*[.,]\d{2}|\d+[.,]\d{2})(?!\d)/g;
  function nums(l) { var out = [], m; moneyRe.lastIndex = 0; while ((m = moneyRe.exec(l))) { var v = parseAmount(m[1]); if (v !== null) out.push(v); } return out; }
  var amount = null, i;
  for (i = 0; i < lines.length && amount === null; i++) {
    var l = lines[i];
    if (/\b(grand\s*total|total|amount\s*(due|paid)|importe|balance\s*due)\b/i.test(l) && !/sub\s*-?\s*total|total\s*(items|savings|discount|tax)|you\s*saved|ahorro/i.test(l)) {
      var n = nums(l).concat(i + 1 < lines.length ? nums(lines[i + 1]) : []);
      if (n.length) amount = Math.max.apply(null, n);
    }
  }
  if (amount === null) {
    var all = []; lines.forEach(function (l) { all = all.concat(nums(l)); });
    all = all.filter(function (v) { return v > 0 && v < 20000; });
    if (all.length) amount = Math.max.apply(null, all);
  }
  var date = null, dm = text.match(/\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/) || text.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/);
  if (dm) {
    var y, mo, d;
    if (dm[1].length === 4) { y = +dm[1]; mo = +dm[2]; d = +dm[3]; }
    else { y = +dm[3]; if (y < 100) y += 2000; if (+dm[1] > 12) { d = +dm[1]; mo = +dm[2]; } else { mo = +dm[1]; d = +dm[2]; } }
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= dim(y, mo)) {
      var k = y + '-' + pad(mo) + '-' + pad(d), age = dayNum(today()) - dayNum(k);
      if (age >= 0 && age <= 120) date = k;
    }
  }
  var merchant = '';
  for (i = 0; i < Math.min(8, lines.length); i++) {
    var c = lines[i];
    if (/[a-z]{3,}/i.test(c) && c.replace(/\D/g, '').length < 4 && !/receipt|recibo|welcome|bienvenid|thank|gracias|store\s*#|tel|phone|www\.|http/i.test(c)) { merchant = c.replace(/[^\w&'\- .]/g, '').trim().slice(0, 40); break; }
  }
  return { amount: amount, date: date, merchant: merchant, category: guessCategory(text + ' ' + merchant, cats) };
}
function guessCategory(text, cats) {
  var t = String(text).toLowerCase();
  var rules = [
    ['Groceries', /grocer|supermarket|supermercado|market|walmart|kroger|aldi|publix|costco|whole foods|trader joe|safeway|\bheb\b|food lion|meijer|lidl|sam'?s club/],
    ['Transport', /\bgas\b|fuel|gasolina|shell|exxon|chevron|marathon|valero|speedway|circle k|uber|lyft|parking|toll|transit/],
    ['Dining out', /restaurant|restaurante|cafe|café|coffee|starbucks|pizza|grill|burger|taco|mcdonald|chick-fil|wendy|subway|chipotle|kitchen|bistro|diner|bakery|panader/],
    ['Health', /pharmacy|farmacia|cvs|walgreens|clinic|clínica|dental|doctor|hospital|optical/],
    ['Utilities', /electric|power co|water|internet|wifi|comcast|xfinity|verizon|t-mobile|spectrum|utility/],
    ['Entertainment', /cinema|theater|theatre|movie|cine|concert|ticket/],
    ['Shopping', /target|amazon|best buy|home depot|lowe'?s|ikea|mall|clothing|shoes|dollar general|dollar tree|tienda/]
  ];
  for (var i = 0; i < rules.length; i++) if (rules[i][1].test(t) && cats.indexOf(rules[i][0]) !== -1) return rules[i][0];
  return null;
}

    '<p class="hint">Include rent and bills. We split it across everyday categories you can change later. Leave it blank to use a sample budget.</p>' +
    '<button class="btn block" style="margin-top:16px" id="sGo">Start my budget</button>' +
    '<button class="btn line block" style="margin-top:10px;font-size:15px;padding:12px" data-go="today">Keep exploring the example</button></div>';
}
function startFresh() {
  var s = baseState(); s.name = $('sName').value.trim().slice(0, 30); s.currency = $('sCur').value;
  var total = parseAmount($('sTotal').value);
  if (total && total > 0) {
    var base = DEFAULT_CATS.reduce(function (a, c) { return a + c[1]; }, 0);
    s.cats.forEach(function (c, i) { c.limit = Math.round(DEFAULT_CATS[i][1] / base * total); });
    var diff = Math.round(total) - s.cats.reduce(function (a, c) { return a + c.limit; }, 0); s.cats[s.cats.length - 1].limit += diff;
  }
  S = s; fmtCache = {}; save();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  toast('Your budget is ready. Add your bills next.');
  go('bills');
}

/* ================= Events ================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('button, [data-go], label');
  if (!t) return;
  var d = t.dataset;
  if (d.go) { if (view === 'add') readForm(); go(d.go); return; }
  if (d.type) { readForm(); ui.type = d.type; renderAdd(); return; }
  if (d.cat !== undefined && t.classList.contains('chip')) { readForm(); ui.cat = d.cat; renderAdd(); return; }
  if (t.id === 'fSave') { saveTx(); return; }
  if (d.tx) { ui.openTx = ui.openTx === d.tx ? null : d.tx; render(); return; }
  if (d.deltx) { if (!confirmTap(t, 'Tap again to delete')) return; S.tx = S.tx.filter(function (x) { return x.id !== d.deltx; }); ui.openTx = null; save(); toast('Deleted'); render(); return; }
  if (d.hist) { ui.hist = d.hist; ui.openTx = null; render(); return; }
  if (d.editcat) { ui.editCat = d.editcat; renderBudget(); var n = $('ecLimit'); if (n) n.focus(); return; }
  if (d.cancelcat !== undefined) { ui.editCat = null; renderBudget(); return; }
  if (d.savecat) {
    var c = S.cats.find(function (x) { return x.id === d.savecat; }), nn = $('ecName').value.trim(), lim = parseAmount($('ecLimit').value);
    if (!nn) { toast('Give the category a name'); return; }
    if (S.cats.some(function (x) { return x.id !== c.id && x.name.toLowerCase() === nn.toLowerCase(); })) { toast('You already have a category with that name'); return; }
    if (nn !== c.name) { S.tx.forEach(function (x) { if (x.type !== 'Income' && x.cat === c.name) x.cat = nn; }); S.bills.forEach(function (b) { if (!isIncomeBill(b) && b.cat === c.name) b.cat = nn; }); }
    c.name = nn; c.limit = lim && lim > 0 ? lim : 0; ui.editCat = null; save(); toast('Saved'); renderBudget(); return;
  }
  if (d.delcat) {
    if (!confirmTap(t, 'Tap again to delete')) return;
    S.cats = S.cats.filter(function (x) { return x.id !== d.delcat; }); ui.editCat = null; save(); toast('Category deleted. Past spending is kept.'); renderBudget(); return;
  }
  if (t.id === 'ncAdd') {
    var nm = $('ncName').value.trim(), nl = parseAmount($('ncLimit').value);
    if (!nm) { toast('Give the category a name'); return; }
    if (S.cats.some(function (x) { return x.name.toLowerCase() === nm.toLowerCase(); })) { toast('You already have that category'); return; }
    S.cats.push({ id: uid(), name: nm.slice(0, 30), limit: nl && nl > 0 ? nl : 0 }); save(); toast('Added ' + nm); renderBudget(); return;
  }
  if (d.editinc) { ui.editInc = d.editinc; renderBudget(); var ei = $('eiExp'); if (ei) ei.focus(); return; }
  if (d.cancelinc !== undefined) { ui.editInc = null; renderBudget(); return; }
  if (d.saveinc) {
    var ic = S.incomeCats.find(function (x) { return x.id === d.saveinc; }), inn = $('eiName').value.trim(), iexp = parseAmount($('eiExp').value);
    if (!inn) { toast('Give the income type a name'); return; }
    if (S.incomeCats.some(function (x) { return x.id !== ic.id && x.name.toLowerCase() === inn.toLowerCase(); })) { toast('You already have an income type with that name'); return; }
    if (inn !== ic.name) { S.tx.forEach(function (x) { if (x.type === 'Income' && x.cat === ic.name) x.cat = inn; }); S.bills.forEach(function (b) { if (isIncomeBill(b) && b.cat === ic.name) b.cat = inn; }); }
    ic.name = inn; ic.expected = iexp && iexp > 0 ? iexp : 0; ui.editInc = null; save(); toast('Saved'); renderBudget(); return;
  }
  if (d.delinc) {
    if (!confirmTap(t, 'Tap again to delete')) return;
    if (S.incomeCats.length <= 1) { toast('Keep at least one income type'); return; }
    S.incomeCats = S.incomeCats.filter(function (x) { return x.id !== d.delinc; }); ui.editInc = null; save(); toast('Income type deleted. Past income is kept.'); renderBudget(); return;
  }
  if (t.id === 'niAdd') {
    var nin = $('niName').value.trim(), nie = parseAmount($('niExp').value);
    if (!nin) { toast('Give the income type a name'); return; }
    if (S.incomeCats.some(function (x) { return x.name.toLowerCase() === nin.toLowerCase(); })) { toast('You already have that income type'); return; }
    S.incomeCats.push({ id: uid(), name: nin.slice(0, 30), expected: nie && nie > 0 ? nie : 0 }); save(); toast('Added ' + nin); renderBudget(); return;
  }
  if (d.openbill) { ui.editBill = d.openbill; renderBills(); return; }
  if (d.cancelbill !== undefined) { ui.editBill = null; renderBills(); return; }
  if (d.savebill) {
    var nb = readBill('eb'); if (!nb) return;
    Object.assign(S.bills.find(function (x) { return x.id === d.savebill; }), nb); ui.editBill = null; processBills(); save(); toast('Bill saved'); renderBills(); return;
  }
  if (d.paybill) {
    var b = S.bills.find(function (x) { return x.id === d.paybill; });
    S.tx.push({ id: uid(), date: today(), type: isIncomeBill(b) ? 'Income' : 'Expense', cat: b.cat, desc: b.name, amount: b.amount, method: 'Other', src: 'bill' });
    b.next = addCycle(b.next > today() ? b.next : today(), b.cycle); ui.editBill = null; save(); toast('Logged ' + money(b.amount) + '. Next on ' + niceDate(b.next)); renderBills(); return;
  }
  if (d.delbill) { if (!confirmTap(t, 'Tap again to delete')) return; S.bills = S.bills.filter(function (x) { return x.id !== d.delbill; }); ui.editBill = null; save(); toast('Bill deleted'); renderBills(); return; }
  if (t.id === 'nbAdd') { var bill = readBill('nb'); if (!bill) return; bill.id = uid(); S.bills.push(bill); var lg = processBills(); save(); toast('Added ' + bill.name + (lg.length ? ' and logged today’s charge' : '')); renderBills(); return; }
  if (t.id === 'mSave') { S.name = $('mName').value.trim().slice(0, 30); S.currency = $('mCur').value; fmtCache = {}; save(); toast('Saved'); render(); return; }
  if (t.id === 'rAdd') {
    S.reminders = { morning: $('rM').value || '08:00', midday: $('rD').value || '13:00', night: $('rN').value || '21:00' }; save();
    download('pocket-budget-reminders.ics', icsFile(), 'text/calendar');
    toast('Calendar file created. If nothing opened, use the installed app or open this page in your browser.'); return;
  }
  if (t.id === 'bDown') { download('pocket-budget-backup-' + today() + '.json', backupText(), 'application/json'); toast('Backup file created. If nothing downloaded, use Copy backup.'); return; }
  if (t.id === 'bCopy') { $('bPaste').value = backupText(); copyText($('bPaste').value, 'Backup copied. Paste it into a note or email to yourself.'); return; }
  if (t.id === 'cDown') { download('pocket-budget-' + today() + '.csv', csvFile(), 'text/csv'); toast('CSV created. If nothing downloaded, open the app outside this preview.'); return; }
  if (t.id === 'bRestore') { var txt = $('bPaste').value.trim(); if (!txt) { toast('Paste a backup first'); return; } restore(txt); return; }
  if (t.id === 'resetBtn') { if (!confirmTap(t, 'Tap again to erase everything')) return; S = demoState(); save(); toast('Erased. Showing example data.'); go('today'); return; }
  if (t.id === 'installBtn' && installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; renderMore(); }); return; }
  if (t.id === 'sGo') { startFresh(); return; }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'scanFile') { scanFile(e.target.files && e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'bFile') { var f = e.target.files && e.target.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { restore(String(r.result)); }; r.readAsText(f); e.target.value = ''; }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'fAmount') { e.preventDefault(); saveTx(); } });
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (view === 'more') renderMore(); });
window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== view) go(h); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (processBills().length) toast('Bills due today were added to your spending'); if (view === 'today' || view === 'budget' || view === 'history') render(); } });

/* ================= Start ================= */
var S = load();
if (!S) { S = demoState(); save(); } else { migrate(S); save(); }
var logged = processBills();
go((location.hash || '').slice(1) || 'today');
if (logged.length && !S.demo) toast('Added today’s bills: ' + logged.join(', '));

// Offline support when hosted (GitHub Pages etc.). Ignored where service workers are unavailable.
try { if ('serviceWorker' in navigator && /^https:$/.test(location.protocol) && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* ignore */ }
})();
</script>
